name: OBS compatibility

on:
  schedule:
    # GitHub Actions evaluates cron in UTC: Sunday at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-compatibility
  cancel-in-progress: false

jobs:
  discover:
    name: Find a newer OBS release
    runs-on: ubuntu-22.04
    outputs:
      update: ${{ steps.release.outputs.update }}
      obs_version: ${{ steps.release.outputs.obs_version }}
      source_url: ${{ steps.release.outputs.source_url }}
      runtime_url: ${{ steps.release.outputs.runtime_url }}
      deps_version: ${{ steps.release.outputs.deps_version }}
      prebuilt_sha: ${{ steps.release.outputs.prebuilt_sha }}
      qt6_sha: ${{ steps.release.outputs.qt6_sha }}
      qt6_pdb_sha: ${{ steps.release.outputs.qt6_pdb_sha }}
      repair_version: ${{ steps.release.outputs.repair_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check the OBS release feed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_obs="$(jq -r '.dependencies["obs-studio"].version' buildspec.json)"
          obs_release="$(gh api repos/obsproject/obs-studio/releases/latest)"
          latest_obs="$(jq -er '.tag_name' <<<"${obs_release}")"

          if [[ ! "${latest_obs}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported OBS release tag: ${latest_obs}" >&2
            exit 1
          fi

          if [[ "${current_obs}" == "${latest_obs}" ]]; then
            echo 'OBS is already current.'
            echo 'update=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          newest="$(printf '%s\n' "${current_obs}" "${latest_obs}" | sort -V | tail -n 1)"
          if [[ "${newest}" != "${latest_obs}" ]]; then
            echo "The checked-in OBS version is newer than the release feed."
            echo 'update=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          deps_release="$(gh api repos/obsproject/obs-deps/releases/latest)"
          deps_version="$(jq -er '.tag_name' <<<"${deps_release}")"
          prebuilt_name="windows-deps-${deps_version}-x64.zip"
          qt6_name="windows-deps-qt6-${deps_version}-x64.zip"
          qt6_pdb_name="windows-deps-qt6-${deps_version}-x64-PDBs.zip"

          prebuilt_digest="$(jq -er --arg name "${prebuilt_name}" '.assets[] | select(.name == $name) | .digest' <<<"${deps_release}")"
          qt6_digest="$(jq -er --arg name "${qt6_name}" '.assets[] | select(.name == $name) | .digest' <<<"${deps_release}")"
          qt6_pdb_digest="$(jq -er --arg name "${qt6_pdb_name}" '.assets[] | select(.name == $name) | .digest' <<<"${deps_release}")"
          prebuilt_sha="${prebuilt_digest#sha256:}"
          qt6_sha="${qt6_digest#sha256:}"
          qt6_pdb_sha="${qt6_pdb_digest#sha256:}"

          for digest in "${prebuilt_sha}" "${qt6_sha}" "${qt6_pdb_sha}"; do
            if [[ ! "${digest}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Invalid dependency digest: ${digest}" >&2
              exit 1
            fi
          done

          runtime_name="OBS-Studio-${latest_obs}-Windows-x64.zip"
          runtime_url="$(jq -er --arg name "${runtime_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${obs_release}")"
          source_url="https://github.com/obsproject/obs-studio/archive/refs/tags/${latest_obs}.zip"

          # The first requested release uses the explicit 1.1.2.3322 name.
          # Later repair releases use the numeric OBS version without dots.
          if [[ "${latest_obs}" == '32.2.2' ]]; then
            repair_version='1.1.2.3322'
          else
            repair_version="1.1.2.${latest_obs//./}"
          fi

          {
            echo 'update=true'
            echo "obs_version=${latest_obs}"
            echo "source_url=${source_url}"
            echo "runtime_url=${runtime_url}"
            echo "deps_version=${deps_version}"
            echo "prebuilt_sha=${prebuilt_sha}"
            echo "qt6_sha=${qt6_sha}"
            echo "qt6_pdb_sha=${qt6_pdb_sha}"
            echo "repair_version=${repair_version}"
          } >> "${GITHUB_OUTPUT}"

  verify:
    name: Build and run the candidate plugin
    needs: discover
    if: needs.discover.outputs.update == 'true'
    runs-on: windows-2022
    outputs:
      source_hash: ${{ steps.prepare.outputs.source_hash }}
    permissions:
      contents: read
    env:
      OBS_VERSION: ${{ needs.discover.outputs.obs_version }}
      SOURCE_URL: ${{ needs.discover.outputs.source_url }}
      RUNTIME_URL: ${{ needs.discover.outputs.runtime_url }}
      DEPS_VERSION: ${{ needs.discover.outputs.deps_version }}
      PREBUILT_SHA: ${{ needs.discover.outputs.prebuilt_sha }}
      QT6_SHA: ${{ needs.discover.outputs.qt6_sha }}
      QT6_PDB_SHA: ${{ needs.discover.outputs.qt6_pdb_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download and pin the candidate OBS source
        id: prepare
        shell: pwsh
        run: |
          $sourceZip = Join-Path $env:RUNNER_TEMP "obs-studio-$env:OBS_VERSION.zip"
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile $sourceZip
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()

          $spec = Get-Content -LiteralPath 'buildspec.json' -Raw | ConvertFrom-Json
          $spec.dependencies.'obs-studio'.version = $env:OBS_VERSION
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $sourceHash
          $spec.dependencies.prebuilt.version = $env:DEPS_VERSION
          $spec.dependencies.prebuilt.hashes.'windows-x64' = $env:PREBUILT_SHA
          $spec.dependencies.qt6.version = $env:DEPS_VERSION
          $spec.dependencies.qt6.hashes.'windows-x64' = $env:QT6_SHA
          $spec.dependencies.qt6.debugSymbols.hashes.'windows-x64' = $env:QT6_PDB_SHA
          $spec | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'buildspec.json' -Encoding utf8

          $deps = Join-Path (Get-Location).Path '.deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          Copy-Item -LiteralPath $sourceZip -Destination (Join-Path $deps "$env:OBS_VERSION.zip") -Force
          "source_hash=$sourceHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the plugin
        shell: pwsh
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Load the plugin in OBS
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "obs-runtime-$env:GITHUB_RUN_ID"
          Invoke-WebRequest -Uri $env:RUNTIME_URL -OutFile (Join-Path $env:RUNNER_TEMP "obs-runtime-$env:OBS_VERSION.zip")
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "obs-runtime-$env:OBS_VERSION.zip") -DestinationPath $runtimeRoot

          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'release\RelWithDebInfo'
          $runtimePluginDir = Join-Path $runtimeRoot 'obs-plugins\64bit'
          $packagePluginDir = Join-Path $packageRoot 'obs-plugins\64bit'
          foreach ($file in Get-ChildItem -LiteralPath $packagePluginDir -File) {
            Copy-Item -LiteralPath $file.FullName -Destination $runtimePluginDir -Force
          }
          Copy-Item -LiteralPath (Join-Path $packageRoot 'data\obs-plugins\obs-roi-ui') -Destination (Join-Path $runtimeRoot 'data\obs-plugins') -Recurse -Force

          $obsExe = Join-Path $runtimeRoot 'bin\64bit\obs64.exe'
          $obsWorkDir = Join-Path $runtimeRoot 'bin\64bit'
          $process = Start-Process -FilePath $obsExe -WorkingDirectory $obsWorkDir -ArgumentList @('--portable', '--verbose', '--disable-shutdown-check') -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) {
              throw "OBS exited early with code $($process.ExitCode)."
            }

            $log = Get-ChildItem -LiteralPath (Join-Path $runtimeRoot 'config\obs-studio\logs') -File | Sort-Object LastWriteTime | Select-Object -Last 1
            $logText = Get-Content -LiteralPath $log.FullName -Raw
            foreach ($message in @(
              'Loading module: obs-roi-ui.dll',
              "output 'encoder_preview' (encoder_preview) created",
              "private source 'Encoder Output Preview' (encoder_preview_source) created",
              '[obs-roi-ui] plugin loaded successfully'
            )) {
              if (-not $logText.Contains($message)) {
                throw "OBS log did not contain: $message"
              }
            }
            Get-Content -LiteralPath $log.FullName | Select-String -Pattern 'obs-roi-ui|encoder_preview' | ForEach-Object { $_.Line }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
            }
          }

      - name: Create the Windows package
        shell: pwsh
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo -BuildInstaller

      - name: Upload the verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obs-roi-ui-obs-${{ needs.discover.outputs.obs_version }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  record-success:
    name: Record compatible OBS version
    needs: [discover, verify]
    if: needs.discover.outputs.update == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      OBS_VERSION: ${{ needs.discover.outputs.obs_version }}
      SOURCE_HASH: ${{ needs.verify.outputs.source_hash }}
      DEPS_VERSION: ${{ needs.discover.outputs.deps_version }}
      PREBUILT_SHA: ${{ needs.discover.outputs.prebuilt_sha }}
      QT6_SHA: ${{ needs.discover.outputs.qt6_sha }}
      QT6_PDB_SHA: ${{ needs.discover.outputs.qt6_pdb_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Update the source pin and README badge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          buildspec = Path("buildspec.json")
          data = json.loads(buildspec.read_text(encoding="utf-8"))
          data["dependencies"]["obs-studio"]["version"] = os.environ["OBS_VERSION"]
          data["dependencies"]["obs-studio"]["hashes"]["windows-x64"] = os.environ["SOURCE_HASH"]
          data["dependencies"]["prebuilt"]["version"] = os.environ["DEPS_VERSION"]
          data["dependencies"]["prebuilt"]["hashes"]["windows-x64"] = os.environ["PREBUILT_SHA"]
          data["dependencies"]["qt6"]["version"] = os.environ["DEPS_VERSION"]
          data["dependencies"]["qt6"]["hashes"]["windows-x64"] = os.environ["QT6_SHA"]
          data["dependencies"]["qt6"]["debugSymbols"]["hashes"]["windows-x64"] = os.environ["QT6_PDB_SHA"]
          buildspec.write_text(json.dumps(data, indent=4, ensure_ascii=False) + "\n", encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start_marker = "<!-- obs-compatibility-badge:start -->"
          end_marker = "<!-- obs-compatibility-badge:end -->"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          badge = (
              f"[![OBS Studio compatibility](https://img.shields.io/badge/OBS_Studio-"
              f"{os.environ['OBS_VERSION']}_compatible-brightgreen)](https://github.com/"
              f"obsproject/obs-studio/releases/tag/{os.environ['OBS_VERSION']})"
          )
          text = text[:start] + start_marker + "\n" + badge + "\n" + text[end:]
          readme.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buildspec.json README.md
          if git diff --cached --quiet; then
            echo 'No source or badge change is needed.'
          else
            git commit -m "ci: verify OBS ${OBS_VERSION} compatibility"
            git push origin HEAD:main
          fi

  repair:
    name: Repair and release an incompatible OBS update
    needs: [discover, verify]
    if: needs.discover.outputs.update == 'true' && needs.verify.result == 'failure'
    runs-on: windows-2022
    permissions:
      contents: write
      issues: write
    env:
      OBS_VERSION: ${{ needs.discover.outputs.obs_version }}
      SOURCE_URL: ${{ needs.discover.outputs.source_url }}
      RUNTIME_URL: ${{ needs.discover.outputs.runtime_url }}
      DEPS_VERSION: ${{ needs.discover.outputs.deps_version }}
      PREBUILT_SHA: ${{ needs.discover.outputs.prebuilt_sha }}
      QT6_SHA: ${{ needs.discover.outputs.qt6_sha }}
      QT6_PDB_SHA: ${{ needs.discover.outputs.qt6_pdb_sha }}
      RELEASE_VERSION: ${{ needs.discover.outputs.repair_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check for the repair secret
        id: repair-secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'available=false'
          } else {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'available=true'
          }

      - name: Report a missing repair secret
        if: steps.repair-secret.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $body = @"
          The scheduled OBS compatibility check could not build OBS $env:OBS_VERSION.

          Configure the repository `OPENAI_API_KEY` secret to enable the constrained automatic repair path, then rerun this workflow.

          Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          gh issue create --title "OBS $env:OBS_VERSION compatibility check failed" --body $body
          throw 'OPENAI_API_KEY is not configured; no unverified release was created.'

      - name: Prepare the candidate source
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          $sourceZip = Join-Path $env:RUNNER_TEMP "obs-studio-$env:OBS_VERSION.zip"
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile $sourceZip
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec = Get-Content -LiteralPath 'buildspec.json' -Raw | ConvertFrom-Json
          $spec.dependencies.'obs-studio'.version = $env:OBS_VERSION
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $sourceHash
          $spec.dependencies.prebuilt.version = $env:DEPS_VERSION
          $spec.dependencies.prebuilt.hashes.'windows-x64' = $env:PREBUILT_SHA
          $spec.dependencies.qt6.version = $env:DEPS_VERSION
          $spec.dependencies.qt6.hashes.'windows-x64' = $env:QT6_SHA
          $spec.dependencies.qt6.debugSymbols.hashes.'windows-x64' = $env:QT6_PDB_SHA
          $spec | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'buildspec.json' -Encoding utf8
          $deps = Join-Path (Get-Location).Path '.deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          Copy-Item -LiteralPath $sourceZip -Destination (Join-Path $deps "$env:OBS_VERSION.zip") -Force

      - name: Run the constrained repair agent
        if: steps.repair-secret.outputs.available == 'true'
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unsafe
          prompt: |
            Repair this OBS plugin for OBS ${{ needs.discover.outputs.obs_version }}.

            A clean Windows compatibility build failed before this job. The candidate OBS source ZIP is in .deps/${{ needs.discover.outputs.obs_version }}.zip and buildspec.json points to it. Reproduce the failure with:

            cmake --preset windows-ci-x64
            cmake --build --preset windows-ci-x64 --parallel

            Make only the smallest source or build-file changes required for this plugin to compile and load with this OBS version. Preserve existing ROI and encoder preview behavior. Do not add a compatibility layer, fallback loading, new architecture, performance work, or unrelated formatting. Do not change the plugin version, README, CHANGELOG, workflows, release files, or Git history. Do not commit or push. Run the build again after your edits and leave the working tree ready for the later verification steps.

      - name: Check the repair scope
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          $allowed = @('buildspec.json', 'CMakeLists.txt', 'CMakePresets.json')
          $changed = @(git diff --name-only)
          $disallowed = @($changed | Where-Object {
            ($_ -notin $allowed) -and ($_ -notmatch '^(src|cmake)/')
          })
          if ($disallowed.Count -gt 0) {
            throw "Repair changed files outside the allowed source/build scope: $($disallowed -join ', ')"
          }

      - name: Set the fixed release metadata
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          $sourceZip = Join-Path (Join-Path (Get-Location).Path '.deps') "$env:OBS_VERSION.zip"
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec = Get-Content -LiteralPath 'buildspec.json' -Raw | ConvertFrom-Json
          $spec.version = $env:RELEASE_VERSION
          $spec.dependencies.'obs-studio'.version = $env:OBS_VERSION
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $sourceHash
          $spec.dependencies.prebuilt.version = $env:DEPS_VERSION
          $spec.dependencies.prebuilt.hashes.'windows-x64' = $env:PREBUILT_SHA
          $spec.dependencies.qt6.version = $env:DEPS_VERSION
          $spec.dependencies.qt6.hashes.'windows-x64' = $env:QT6_SHA
          $spec.dependencies.qt6.debugSymbols.hashes.'windows-x64' = $env:QT6_PDB_SHA
          $spec | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'buildspec.json' -Encoding utf8

          $readme = Get-Content -LiteralPath 'README.md' -Raw
          $badgeStart = '<!-- obs-compatibility-badge:start -->'
          $badgeEnd = '<!-- obs-compatibility-badge:end -->'
          $start = $readme.IndexOf($badgeStart)
          $end = $readme.IndexOf($badgeEnd, $start)
          if (($start -lt 0) -or ($end -lt 0)) { throw 'README compatibility badge markers are missing.' }
          $badge = "[![OBS Studio compatibility](https://img.shields.io/badge/OBS_Studio-$env:OBS_VERSION`_compatible-brightgreen)](https://github.com/obsproject/obs-studio/releases/tag/$env:OBS_VERSION)"
          $readme = $readme.Substring(0, $start) + "$badgeStart`n$badge`n" + $readme.Substring($end)
          $releaseStart = '<!-- current-release:start -->'
          $releaseEnd = '<!-- current-release:end -->'
          $releasePattern = '(?s)<!-- current-release:start -->.*?<!-- current-release:end -->'
          $releaseText = "$releaseStart`nThe current release is **$env:RELEASE_VERSION** for OBS Studio $env:OBS_VERSION. Install the package while OBS is closed.`n$releaseEnd"
          $readme = [regex]::Replace($readme, $releasePattern, $releaseText, 1)
          Set-Content -LiteralPath 'README.md' -Value $readme -Encoding utf8 -NoNewline

          $entry = "## $env:RELEASE_VERSION - OBS Studio $env:OBS_VERSION`n`n- Repaired the plugin for OBS $env:OBS_VERSION after the scheduled compatibility build failed.`n- Published only after a clean build and OBS load smoke test.`n`n"
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $headerEnd = $changelog.IndexOf("`n")
          $changelog = $changelog.Substring(0, $headerEnd + 1) + "`n$entry" + $changelog.Substring($headerEnd + 1)
          Set-Content -LiteralPath 'CHANGELOG.md' -Value $changelog -Encoding utf8 -NoNewline

      - name: Build the fixed plugin
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Load the fixed plugin in OBS
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "obs-runtime-$env:GITHUB_RUN_ID"
          Invoke-WebRequest -Uri $env:RUNTIME_URL -OutFile (Join-Path $env:RUNNER_TEMP "obs-runtime-$env:OBS_VERSION.zip")
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "obs-runtime-$env:OBS_VERSION.zip") -DestinationPath $runtimeRoot
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'release\RelWithDebInfo'
          foreach ($file in Get-ChildItem -LiteralPath (Join-Path $packageRoot 'obs-plugins\64bit') -File) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $runtimeRoot 'obs-plugins\64bit') -Force
          }
          Copy-Item -LiteralPath (Join-Path $packageRoot 'data\obs-plugins\obs-roi-ui') -Destination (Join-Path $runtimeRoot 'data\obs-plugins') -Recurse -Force
          $process = Start-Process -FilePath (Join-Path $runtimeRoot 'bin\64bit\obs64.exe') -WorkingDirectory (Join-Path $runtimeRoot 'bin\64bit') -ArgumentList @('--portable', '--verbose', '--disable-shutdown-check') -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) { throw "OBS exited early with code $($process.ExitCode)." }
            $log = Get-ChildItem -LiteralPath (Join-Path $runtimeRoot 'config\obs-studio\logs') -File | Sort-Object LastWriteTime | Select-Object -Last 1
            $logText = Get-Content -LiteralPath $log.FullName -Raw
            foreach ($message in @(
              'Loading module: obs-roi-ui.dll',
              "output 'encoder_preview' (encoder_preview) created",
              "private source 'Encoder Output Preview' (encoder_preview_source) created",
              '[obs-roi-ui] plugin loaded successfully'
            )) {
              if (-not $logText.Contains($message)) { throw "OBS log did not contain: $message" }
            }
            Get-Content -LiteralPath $log.FullName | Select-String -Pattern 'obs-roi-ui|encoder_preview' | ForEach-Object { $_.Line }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - name: Package the fixed release
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo -BuildInstaller

      - name: Create release notes and checksums
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          $notes = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $notes += "`n## Checksums`n"
          foreach ($file in Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Extension -in @('.exe', '.zip') }) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $notes += "`n- ``$($file.Name)``: ``$hash``"
          }
          Set-Content -LiteralPath 'RELEASE_NOTES.md' -Value $notes -Encoding utf8 -NoNewline

      - name: Push the fixed source and tag
        if: steps.repair-secret.outputs.available == 'true'
        shell: pwsh
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buildspec.json README.md CHANGELOG.md CMakeLists.txt CMakePresets.json cmake src
          git commit -m "fix: restore OBS $env:OBS_VERSION compatibility"
          git tag $env:RELEASE_VERSION
          git push origin HEAD:main
          git push origin "refs/tags/$env:RELEASE_VERSION"

      - name: Publish the fixed release
        if: steps.repair-secret.outputs.available == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.discover.outputs.repair_version }}
          name: OBS ROI Editor ${{ needs.discover.outputs.repair_version }}
          body_path: RELEASE_NOTES.md
          draft: false
          files: |
            release/*.exe
            release/*.zip
